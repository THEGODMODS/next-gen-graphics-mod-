name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# This is a Windows Electron application. Keep the newest commit moving
# through one Windows runner instead of waiting for a redundant Linux matrix.
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-quality:
    name: Windows source, module and app validation
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install pinned Lua parser
        run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund luaparse@0.3.1
      - name: Build original GODMODS source assets
        run: npm run mods:build-original
      - name: Build installable GODMODS Sider modules
        run: npm run mods:build-packs
      - name: Verify GODMODS module manifests and payloads
        run: npm run mods:verify-packs
      - name: Parse every generated Sider Lua module (Lua 5.1)
        run: npm run mods:check-lua
      - name: Verify Sider 3.5 restricted Lua environment
        shell: pwsh
        run: |
          $loader = Get-Content content/packs/thegodmods.core-loader/payload/GODMODS_Loader.lua -Raw
          foreach ($name in @('pcall', 'xpcall', 'loadstring', 'require')) {
            if ($loader -match ('\b' + [regex]::Escape($name) + '\s*\(')) {
              throw "Generated master loader calls unsupported Sider 3.5 global: $name"
            }
          }
          if ($loader -notmatch 'function M\.init\(ctx\)') { throw "Sider module init(ctx) entry point is missing." }
          if ($loader -notmatch 'ctx\.register') { throw "Sider event registration bridge is missing." }
          Write-Host "Sider 3.5 environment scan passed."
      - name: Upload standalone GODMODS Lua module
        uses: actions/upload-artifact@v4
        with:
          name: GODMODS-Lua-Module-Sider-3.5
          path: content/packs/thegodmods.core-loader/payload/GODMODS_Loader.lua
          if-no-files-found: error
          retention-days: 30
      - name: GODMODS cross-department source regression
        run: npm run audit:godmods-final
      - name: TypeScript validation
        run: npm run typecheck
      - name: Native Node ESM smoke test
        run: >-
          node --input-type=module -e "await Promise.all([
          './tools/dds-audit.mjs',
          './tools/dds-compare.mjs',
          './tools/dds-inspect.mjs',
          './tools/dds-preview.mjs',
          './tools/pitch-inventory.mjs',
          './tools/pitch-module-builder.mjs',
          './tools/pes2017-resource-audit.mjs',
          './tools/godmods-dds-compositor.mjs',
          './tools/godmods-audio-qa.mjs',
          './tools/godmods-gameplay-qa.mjs',
          './tools/godmods-lut-qa.mjs',
          './tools/godmods-final-regression.mjs',
          './tools/godmods-atmosphere-engine.mjs',
          './tools/godmods-integration-gate.mjs'
          ].map((file) => import(file)))"
      - name: Syntax-check asset generators
        run: |
          node --check tools/build-original-mods.mjs
          node --check tools/build-premium-upgrades.mjs
          node --check tools/build-pes2017-modules.mjs
          node --check tools/godmods-atmosphere-engine.mjs
          node --check tools/godmods-integration-gate.mjs
          node --check tools/god-kits-mapping.mjs
          node --check tools/god-faces-mapping.mjs
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
