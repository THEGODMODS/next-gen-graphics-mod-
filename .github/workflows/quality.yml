name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# This is a Windows Electron application. Keep the newest commit moving
# through one Windows runner instead of waiting for a redundant Linux matrix.
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-quality:
    name: Windows validation and installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: TypeScript validation
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Build Windows NSIS installer
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: npx electron-builder --win nsis
      - name: Upload Windows test installer
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: pes2017-nextgen-windows-${{ github.sha }}
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14
