name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# This is a Windows Electron application. Keep the newest commit moving
# through one Windows runner instead of waiting for a redundant Linux matrix.
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-quality:
    name: Windows validation and installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build original GODMODS source assets
        run: npm run mods:build-original
      - name: Upload generated original GODMODS content
        uses: actions/upload-artifact@v4
        with:
          name: thegodmods-original-content-${{ github.sha }}
          path: content/originals/generated/**
          if-no-files-found: error
          retention-days: 30
      - name: TypeScript validation
        run: npm run typecheck
      - name: Native Node ESM smoke test
        run: >-
          node --input-type=module -e "await Promise.all([
          './tools/dds-audit.mjs',
          './tools/dds-compare.mjs',
          './tools/dds-inspect.mjs',
          './tools/dds-preview.mjs',
          './tools/pitch-inventory.mjs',
          './tools/pitch-module-builder.mjs'
          ].map((file) => import(file)))"
      - name: Syntax-check asset generators
        run: |
          node --check tools/build-original-mods.mjs
          node --check tools/build-premium-upgrades.mjs
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Build Windows NSIS installer
        run: npx electron-builder --win nsis --publish never
      - name: Upload Windows test installer
        uses: actions/upload-artifact@v4
        with:
          name: pes2017-nextgen-windows-${{ github.sha }}
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14
