name: GODMODS Manager Windows Release

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/release.yml"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Version tag to build (must match package.json)"
        required: true
        default: "v0.2.0"
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-release:
    name: Validate and package Windows release
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ inputs.release_tag || 'v0.2.0' }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify release tag and source branch
        shell: pwsh
        run: |
          $tag = "$env:RELEASE_TAG"
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          if ($tag -ne "v$($package.version)") {
            throw "Release tag $tag does not match package.json version v$($package.version)."
          }
          git fetch origin main
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) {
            throw "Release tags must point to a commit reachable from main."
          }

      - name: Create release tag for manual runs
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        shell: pwsh
        run: |
          if ("${{ github.ref_name }}" -ne "main") {
            throw "Run manual releases from the main branch."
          }
          $tag = "$env:RELEASE_TAG"
          $remoteTag = git ls-remote --tags origin "refs/tags/$tag"
          if ($LASTEXITCODE -ne 0) { throw "Could not check whether release tag $tag already exists." }
          if ($remoteTag) {
            git fetch origin "refs/tags/${tag}:refs/tags/${tag}"
            if ($LASTEXITCODE -ne 0) { throw "Could not fetch existing release tag $tag." }
            $tagCommit = git rev-parse "$tag^{commit}"
            if ($tagCommit -ne $env:GITHUB_SHA) {
              gh release view $tag --json isDraft --jq .isDraft *> $null
              if ($LASTEXITCODE -eq 0) {
                $isDraft = (gh release view $tag --json isDraft --jq .isDraft).Trim()
                if ($isDraft -ne "true") {
                  throw "Release $tag is already published; refusing to move a published release tag."
                }
                gh release delete $tag --yes
                if ($LASTEXITCODE -ne 0) { throw "Could not remove the superseded draft release $tag." }
                Write-Host "Removed superseded draft release $tag so the corrected package can be attached."
              }
              git tag --force "$tag" $env:GITHUB_SHA
              if ($LASTEXITCODE -ne 0) { throw "Could not move unpublished release tag $tag to this main commit." }
              git push --force origin "refs/tags/$tag"
              if ($LASTEXITCODE -ne 0) { throw "Could not update unpublished release tag $tag on origin." }
              Write-Host "Updated unpublished release tag $tag to the current main commit."
            } else {
              Write-Host "Release tag $tag already exists on this exact commit; continuing."
            }
          } else {
            git tag "$tag" $env:GITHUB_SHA
            if ($LASTEXITCODE -ne 0) { throw "Could not create release tag $tag." }
            git push origin "$tag"
            if ($LASTEXITCODE -ne 0) { throw "Could not push release tag $tag." }
          }

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript validation
        run: npm run typecheck

      - name: Native Node ESM smoke test
        run: >-
          node --input-type=module -e "await Promise.all([
          './tools/dds-audit.mjs',
          './tools/dds-compare.mjs',
          './tools/dds-inspect.mjs',
          './tools/dds-preview.mjs',
          './tools/pitch-inventory.mjs',
          './tools/pitch-module-builder.mjs'
          ].map((file) => import(file)))"

      # Build all generated mod assets before tests that inspect those outputs.
      - name: Production build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Build GODMODS portable package
        run: npm run portable:win:package

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          $archives = Get-ChildItem release/portable -Filter *.zip -File
          if (-not $archives -or $archives.Count -eq 0) {
            throw "No GODMODS portable ZIP was produced."
          }
          $lines = foreach ($file in $archives) {
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($file.Name)"
          }
          $lines | Set-Content release/SHA256SUMS.txt -Encoding ascii

      - name: Upload release candidate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pes2017-nextgen-release-${{ env.RELEASE_TAG }}
          path: |
            release/portable/*.zip
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Create corrected draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "$env:RELEASE_TAG"
          $notes = @"
          ## GODMODS Manager — $tag

          **Portable package.** Extract the ZIP, copy the complete GODMODS folder into PES 2017/content, then launch GODMODS Tool/GODMODS Manager.exe. No Windows setup wizard is used.

          ### Verification
          - TypeScript validation
          - Native Node ESM smoke tests
          - Unit tests
          - Production build
          - Windows portable ZIP build
          - SHA-256 checksum file

          ### Important
          A successful CI run does not prove in-game compatibility. This application release does not imply that every catalogue mod pack is mapped or verified in-game. Test the manager, installation, rollback and exact PES 2017 + patch + Sider setup before publishing. Do not claim compatibility beyond the tested configuration.
          "@
          Set-Content release/RELEASE-NOTES.md $notes -Encoding utf8
          gh release create $tag (Get-ChildItem release/portable -Filter *.zip | ForEach-Object { $_.FullName }) release/SHA256SUMS.txt release/RELEASE-NOTES.md --draft --verify-tag --title "GODMODS Manager $tag" --notes-file release/RELEASE-NOTES.md
