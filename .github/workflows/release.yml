name: GODMODS Manager Windows Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-release:
    name: Validate and package Windows release
    runs-on: windows-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify release tag and source branch
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          if ($tag -ne "v$($package.version)") {
            throw "Release tag $tag does not match package.json version v$($package.version)."
          }
          git fetch origin main
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) {
            throw "Release tags must point to a commit reachable from main."
          }

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: TypeScript validation
        run: npm run typecheck

      - name: Native Node ESM smoke test
        run: >-
          node --input-type=module -e "await Promise.all([
          './tools/dds-audit.mjs',
          './tools/dds-compare.mjs',
          './tools/dds-inspect.mjs',
          './tools/dds-preview.mjs',
          './tools/pitch-inventory.mjs',
          './tools/pitch-module-builder.mjs'
          ].map((file) => import(file)))"

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Build GODMODS portable package
        run: npm run portable:win:package

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          $archives = Get-ChildItem release/portable -Filter *.zip -File
          if (-not $archives -or $archives.Count -eq 0) {
            throw "No GODMODS portable ZIP was produced."
          }
          $lines = foreach ($file in $archives) {
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($file.Name)"
          }
          $lines | Set-Content release/SHA256SUMS.txt -Encoding ascii

      - name: Upload release candidate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pes2017-nextgen-release-${{ github.ref_name }}
          path: |
            release/portable/*.zip
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $notes = @"
          ## GODMODS Manager — $tag

          **Portable package.** Extract the ZIP, copy the complete GODMODS folder into PES 2017/content, then launch GODMODS Tool/GODMODS Manager.exe. No Windows setup wizard is used.

          ### Verification
          - TypeScript validation
          - Native Node ESM smoke tests
          - Unit tests
          - Production build
          - Windows portable ZIP build
          - SHA-256 checksum file

          ### Important
          A successful CI run does not prove in-game compatibility. This application release does not imply that every catalogue mod pack is mapped or verified in-game. Test the manager, installation, rollback and exact PES 2017 + patch + Sider setup before publishing. Do not claim compatibility beyond the tested configuration.
          "@
          Set-Content release/RELEASE-NOTES.md $notes -Encoding utf8
          gh release create $tag (Get-ChildItem release/portable -Filter *.zip | ForEach-Object { $_.FullName }) release/SHA256SUMS.txt release/RELEASE-NOTES.md --draft --verify-tag --title "GODMODS Manager $tag" --notes-file release/RELEASE-NOTES.md
